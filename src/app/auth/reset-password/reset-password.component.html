<div class="auth-card">
  @let vm = store.vm();

  <h1>Set new password</h1>
  <p class="subtitle">Choose a new password for your account.</p>

  <app-auth-banner variant="error" [message]="vm.errorMessage" />

  <form [formGroup]="store.form" (ngSubmit)="store.submit()" novalidate>
    <app-form-field
      fieldId="password"
      label="New password"
      type="password"
      autocomplete="new-password"
      [control]="store.form.controls.password"
      [invalid]="!vm.isPasswordValid"
      errorMessage="Password must be at least 6 characters"
    />

    <app-form-field
      fieldId="confirm-password"
      label="Confirm password"
      type="password"
      autocomplete="new-password"
      [control]="store.form.controls.confirmPassword"
      [invalid]="!vm.passwordsMatch"
      errorMessage="Passwords do not match"
    />

    <button type="submit" [disabled]="!vm.canSubmit || vm.loading">
      {{ vm.loading ? "Updating…" : "Update password" }}
    </button>
  </form>
</div>
