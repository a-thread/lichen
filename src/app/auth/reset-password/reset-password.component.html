<div class="auth-card">
  @let vm = store.vm();

  <h1>Set new password</h1>
  <p class="subtitle">Choose a new password for your account.</p>

  @if (vm.errorMessage) {
    <div class="banner error">{{ vm.errorMessage }}</div>
  }

  <form [formGroup]="store.form" (ngSubmit)="store.submit()" novalidate>
    <label>
      New password
      <input
        type="password"
        formControlName="password"
        autocomplete="new-password"
        [class.invalid]="
          store.form.controls.password.value && !vm.isPasswordValid
        "
        [attr.aria-invalid]="
          store.form.controls.password.value && !vm.isPasswordValid
            ? true
            : null
        "
        [attr.aria-describedby]="
          store.form.controls.password.value && !vm.isPasswordValid
            ? 'password-error'
            : null
        "
      />
      @if (store.form.controls.password.value && !vm.isPasswordValid) {
        <span id="password-error" class="field-error"
          >Password must be at least 6 characters</span
        >
      }
    </label>

    <label>
      Confirm password
      <input
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
        [class.invalid]="
          store.form.controls.confirmPassword.value && !vm.passwordsMatch
        "
        [attr.aria-invalid]="
          store.form.controls.confirmPassword.value && !vm.passwordsMatch
            ? true
            : null
        "
        [attr.aria-describedby]="
          store.form.controls.confirmPassword.value && !vm.passwordsMatch
            ? 'confirm-password-error'
            : null
        "
      />
      @if (store.form.controls.confirmPassword.value && !vm.passwordsMatch) {
        <span id="confirm-password-error" class="field-error"
          >Passwords do not match</span
        >
      }
    </label>

    <button type="submit" [disabled]="!vm.canSubmit || vm.loading">
      {{ vm.loading ? "Updating…" : "Update password" }}
    </button>
  </form>
</div>
