@let vm = store.vm();

<div class="auth-card">
  <h1>Forgot your password?</h1>

  <p class="subtitle">
    Enter the email address associated with your account and we'll send you
    instructions for resetting your password.
  </p>

  @if (vm.errorMessage) {
    <div class="banner error">{{ vm.errorMessage }}</div>
  }
  @if (vm.sent) {
    <div class="banner info">Check your email for a password reset link.</div>
  }

  <form [formGroup]="store.form" (ngSubmit)="store.send()" novalidate>
    <label>
      Email address
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        [class.invalid]="store.form.controls.email.value && !vm.isEmailValid"
        [attr.aria-invalid]="
          store.form.controls.email.value && !vm.isEmailValid ? true : null
        "
      />
    </label>

    <button type="submit" [disabled]="!vm.canSubmit || vm.loading">
      {{ vm.loading ? "Sending…" : "Reset password" }}
    </button>
  </form>

  <div class="links">
    <a routerLink="/login">Back to sign in</a>
  </div>
</div>
