@let vm = store.vm();

<div class="auth-card">
  <h1>Forgot your password?</h1>

  <p class="subtitle">
    Enter the email address associated with your account and we'll send you
    instructions for resetting your password.
  </p>

  <app-auth-banner variant="error" [message]="vm.errorMessage" />
  <app-auth-banner
    variant="info"
    [message]="vm.sent ? 'Check your email for a password reset link.' : null"
  />

  <form [formGroup]="store.form" (ngSubmit)="store.send()" novalidate>
    <app-form-field
      fieldId="email"
      label="Email address"
      type="email"
      autocomplete="email"
      [control]="store.form.controls.email"
      [invalid]="!vm.isEmailValid"
    />

    <button type="submit" [disabled]="!vm.canSubmit || vm.loading">
      {{ vm.loading ? "Sending…" : "Reset password" }}
    </button>
  </form>

  <div class="links">
    <a routerLink="/login">Back to sign in</a>
  </div>
</div>
