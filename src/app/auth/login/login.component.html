<div class="auth-card">
  @let vm = store.vm();

  <div class="mark">
    <img src="images/ic_lichen_mark.png" alt="" />
  </div>
  <h1>lichen</h1>
  <p class="subtitle">Ideas, resilient by design.</p>

  <app-auth-banner variant="error" [message]="vm.errorMessage" />

  <form [formGroup]="store.form" (ngSubmit)="store.signIn()" novalidate>
    <app-form-field
      fieldId="email"
      label="Email address"
      type="email"
      autocomplete="email"
      [control]="store.form.controls.email"
      [invalid]="!vm.isEmailValid"
    />

    <app-form-field
      fieldId="password"
      label="Password"
      type="password"
      autocomplete="current-password"
      [control]="store.form.controls.password"
    />

    <button type="submit" [disabled]="!vm.canSubmit || vm.loading">
      {{ vm.loading ? "Signing in…" : "Sign in" }}
    </button>
  </form>

  <div class="links">
    <a routerLink="/forgot-password">Forgot password?</a>
    <a routerLink="/signup">Create an account</a>
  </div>
</div>
