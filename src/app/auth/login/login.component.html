<div class="auth-card">
  @let vm = store.vm();

  <div class="mark">
    <img src="images/ic_lichen_mark.png" alt="" />
  </div>
  <h1>lichen</h1>
  <p class="subtitle">Ideas, resilient by design.</p>

  @if (vm.errorMessage) {
    <div class="banner error">{{ vm.errorMessage }}</div>
  }

  <form [formGroup]="store.form" (ngSubmit)="store.signIn()" novalidate>
    <label>
      Email address
      <input
        type="email"
        formControlName="email"
        autocomplete="email"
        [class.invalid]="store.form.controls.email.value && !vm.isEmailValid"
        [attr.aria-invalid]="
          store.form.controls.email.value && !vm.isEmailValid ? true : null
        "
      />
    </label>

    <label>
      Password
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
      />
    </label>

    <button type="submit" [disabled]="!vm.canSubmit || vm.loading">
      {{ vm.loading ? "Signing in…" : "Sign in" }}
    </button>
  </form>

  <div class="links">
    <a routerLink="/forgot-password">Forgot password?</a>
    <a routerLink="/signup">Create an account</a>
  </div>
</div>
