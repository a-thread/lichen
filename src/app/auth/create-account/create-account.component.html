<div class="auth-card">
  @let vm = store.vm();

  <h1>Let's get started</h1>
  <p class="subtitle">Fill in your email and create your free account.</p>

  <app-auth-banner variant="error" [message]="vm.errorMessage" />

  <form [formGroup]="store.form" (ngSubmit)="store.signUp()" novalidate>
    <app-form-field
      fieldId="email"
      label="Email address"
      type="email"
      autocomplete="email"
      [control]="store.form.controls.email"
      [invalid]="!vm.isEmailValid"
    />

    <app-form-field
      fieldId="password"
      label="Password"
      type="password"
      autocomplete="new-password"
      [control]="store.form.controls.password"
      [invalid]="!vm.isPasswordValid"
      errorMessage="Password must be at least 6 characters"
    />

    <app-form-field
      fieldId="confirm-password"
      label="Confirm password"
      type="password"
      autocomplete="new-password"
      [control]="store.form.controls.confirmPassword"
      [invalid]="!vm.passwordsMatch"
      errorMessage="Passwords do not match"
    />

    <button type="submit" [disabled]="!vm.canSubmit || vm.loading">
      {{ vm.loading ? "Creating account…" : "Create account" }}
    </button>
  </form>

  <div class="links">
    <a routerLink="/login">Back to sign in</a>
  </div>
</div>
