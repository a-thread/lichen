@if (open()) {
  <div class="scrim" (click)="cancel()">
    <div
      class="dialog"
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="discard-dialog-title"
      aria-describedby="discard-dialog-message"
      (click)="$event.stopPropagation()"
      (keydown.escape)="cancel()"
      (keydown.tab)="onTab($event)"
    >
      <h2 id="discard-dialog-title">Discard changes?</h2>
      <p id="discard-dialog-message">Your changes will be lost.</p>
      <div class="actions">
        <button
          #cancelButton
          type="button"
          class="secondary"
          (click)="cancel()"
        >
          Cancel
        </button>
        <button #confirmButton type="button" class="danger" (click)="confirm()">
          Discard
        </button>
      </div>
    </div>
  </div>
}
